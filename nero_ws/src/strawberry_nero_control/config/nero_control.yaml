/**:
  ros__parameters:
    # Empty means: resolve the stock NERO URDF from agx_arm_description.
    urdf_path: ""
    base_frame: base_link
    model_tip_frame: link7
    default_controlled_frame: link7

    # Keep generic controller-side camera goals disabled. The formally
    # calibrated link7 -> optical transform is loaded and SHA-checked by the
    # active-perception bridge, not duplicated as an unchecked YAML matrix.
    camera_transform_valid: false

    joint_names:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
      - joint7
    ready_joint_positions:
      - 0.0
      - -1.2698666571660342
      - 0.0
      - 1.8844843532558375
      - 0.0
      - -0.00003490658503988659
      - 0.0

    # Raw pyAgxArm NERO limits in radians. The solver intersects these with
    # the URDF and then removes one two-degree safety margin from both ends.
    joint_lower_limits:
      - -2.705261
      - -1.745330
      - -2.757621
      - -1.012291
      - -2.757621
      - -0.733039
      - -1.570797
    joint_upper_limits:
      - 2.705261
      - 1.745330
      - 2.757621
      - 2.146755
      - 2.757621
      - 0.959932
      - 1.570797

    # Placo task balance. Orientation is deliberately softer than position;
    # posture preference keeps a 7-DoF solution close to measured joints.
    position_weight: 1.0
    orientation_weight: 0.3
    posture_weight: 0.001
    regularization_weight: 0.000001
    solver_dt: 0.020
    max_iterations: 200
    solve_timeout_sec: 0.020
    default_action_timeout_sec: 30.0
    ik_position_tolerance_m: 0.002
    # Continue refining toward 1 mm, while keeping 2 mm as the hard rejection.
    ik_position_convergence_target_m: 0.001
    ik_orientation_tolerance_rad: 0.034906585
    singularity_sigma_min: 0.03
    singularity_condition_max: 100.0

    # Continuity and target deadband.
    position_deadband_m: 0.001
    orientation_deadband_rad: 0.008726646
    max_joint_delta_rad: 0.35
    # Formal 30-pose acceptance only; still far below the general 0.35 limit.
    precision_max_joint_delta_rad: 0.12

    # Quintic trajectory limits, joint1 through joint7.
    trajectory_velocity_limits: [0.30, 0.30, 0.30, 0.30, 0.30, 0.30, 0.30]
    trajectory_acceleration_limits: [0.50, 0.50, 0.50, 0.50, 0.50, 0.50, 0.50]
    trajectory_rate_hz: 50.0

    # Exceptional startup recovery. It never accepts a caller-supplied target:
    # only slightly out-of-range joints may move, and only inward. Execution is
    # separately locked; false still permits a no-command preview action.
    allow_limit_recovery_execution: false
    verified_driver_speed_percent: 0
    recovery_raw_interior_margin_rad: 0.005
    recovery_safe_interior_margin_rad: 0.010
    recovery_max_raw_start_violation_rad: 0.060
    recovery_max_safe_start_violation_rad: 0.120
    recovery_max_ingress_delta_rad: 0.080
    recovery_max_total_delta_rad: 0.120
    recovery_velocity_limit_rad_s: 0.050
    recovery_acceleration_limit_rad_s2: 0.100
    recovery_stationary_velocity_rad_s: 0.020
    recovery_stationary_duration_sec: 0.50
    recovery_sigma_min: 0.10
    recovery_condition_max: 20.0
    recovery_phase_a_pause_error_rad: 0.030
    recovery_phase_a_abort_error_rad: 0.060
    recovery_tracking_pause_error_rad: 0.030
    recovery_tracking_abort_error_rad: 0.060
    recovery_tracking_abort_duration_sec: 0.30
    recovery_final_joint_tolerance_rad: 0.003
    recovery_final_safe_margin_rad: 0.005
    recovery_fixed_joint_tolerance_rad: 0.003
    recovery_progress_tolerance_rad: 0.001
    recovery_plan_start_tolerance_rad: 0.001
    recovery_timeout_max_sec: 15.0

    # Measured-state tracking gates.
    tracking_pause_error_rad: 0.08
    tracking_abort_error_rad: 0.15
    tracking_abort_duration_sec: 0.50
    # The real CAN feedback normally arrives much faster than this, but host
    # scheduling has occasionally produced a single ~0.22 s delivery gap.
    # Keep a 0.50 s watchdog so a genuine feedback outage still aborts the
    # action promptly without turning one delayed callback into an e-stop.
    feedback_timeout_sec: 0.50
    settle_joint_tolerance_rad: 0.020
    settle_velocity_tolerance_rad_s: 0.020
    settle_duration_sec: 0.25
    final_position_tolerance_m: 0.010
    final_orientation_tolerance_rad: 0.087266463

    # Supervised real-arm modes use tighter tracking/final-error gates. The
    # first mode permits one fixed 15 mm move; precision mode supports guarded
    # small repeatability tests. They are mutually exclusive.
    first_motion_test_mode: false
    precision_test_mode: false

    # The launch files override these two values explicitly for sim/real.
    simulation_mode: true
    execution_enabled_on_start: false
    require_arm_status: true
    tf_timeout_sec: 0.20

    joint_feedback_topic: /feedback/joint_states
    arm_status_topic: /feedback/arm_status
    command_topic: /control/move_j
    planned_trajectory_topic: /strawberry_nero/planned_trajectory
    diagnostics_topic: /strawberry_nero/diagnostics
    target_pose_topic: /strawberry_nero/target_pose
    # MeshCat defaults to robust solid STL meshes. Set false to try the
    # official colored DAE appearance meshes instead.
    viewer_use_collision_meshes: true
    action_name: /strawberry_nero/move_to_pose
    recovery_action_name: /strawberry_nero/recover_to_safe
    solve_service_name: /strawberry_nero/solve_ik
    execution_enable_service_name: /strawberry_nero/enable_execution
    emergency_stop_service: /emergency_stop

    metrics_log_enabled: true
    metrics_output_dir: "~/.ros/strawberry_nero_control/metrics"
