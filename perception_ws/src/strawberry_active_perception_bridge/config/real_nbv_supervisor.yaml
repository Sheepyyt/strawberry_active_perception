real_nbv_supervisor:
  ros__parameters:
    # Default is read-only. True additionally requires the exact plan SHA,
    # onsite-clearance boolean, and the matching one-/three-step token.
    execute: false
    # The audited controller accepts exactly 1 (legacy-safe default) or 3.
    max_motion_steps: 1
    operator_workspace_clearance_confirmed: false
    execution_authorization_token: ""
    # Fill both explicitly only after a new execute=false aggregate preview.
    execution_plan_path: ""
    execution_plan_sha256: ""
    # Empty derives <execution_plan_path>.consumed.json beside the preview.
    authorization_receipt_path: ""
    # Audited invariant: setting this false makes the node refuse to start.
    require_aggregate_execution_plan: true
    execution_output_path: /home/yyt/strawberry_active_perception/artifacts/week4/real_nbv_motion_session_execution.json

    base_frame: base_link
    link_frame: link7
    camera_frame: camera_color_optical_frame

    raw_observation_topic: /strawberry/perception/observation
    corrected_observation_topic: /strawberry/perception/real_nbv_observation
    capture_service: /strawberry/perception/capture_observation
    configure_service: /strawberry/nbv/configure
    compute_action: /strawberry/nbv/compute_next_view
    solve_ik_service: /strawberry_nero/solve_ik
    joint_state_topic: /feedback/joint_states
    motion_command_topic: /control/move_j
    arm_status_topic: /feedback/arm_status
    controller_diagnostics_topic: /strawberry_nero/diagnostics
    controller_parameters_service: /nero_control/get_parameters
    driver_gate_service: /control_enable
    controller_gate_service: /strawberry_nero/enable_execution
    move_action: /strawberry_nero/move_to_pose

    handeye_report_path: /home/yyt/strawberry_active_perception/artifacts/week3/handeye_session_001/stability_pose001_030_factory_raw_D.json
    handeye_report_sha256: 31eb93b2b80663b895eac564afc8f633b4310a6b7c5e519340d97d163f22825f
    minimum_calibration_samples: 30
    output_path: /home/yyt/strawberry_active_perception/artifacts/week4/real_nbv_frozen_config_v3_preview.json

    capture_timeout_sec: 2.0
    capture_discard_frames: 3
    planning_capture_count: 5
    aggregate_min_finite_count: 3
    aggregate_mask_majority_count: 3
    max_batch_camera_translation_span_m: 0.00025
    max_batch_camera_rotation_span_deg: 0.10
    operation_timeout_sec: 20.0
    tf_timeout_sec: 1.0
    minimum_target_pixels: 200
    depth_min_m: 0.20
    depth_max_m: 2.50
    voxel_size_m: 0.003
    map_size_m: 0.30
    target_roi_size_m: 0.15
    max_step_m: 0.005
    # Covers the 15 mm cumulative session envelope with 1 mm numerical margin.
    observation_bound_half_extent_m: 0.016
    max_target_drift_m: 0.020
    # Preview and execution target centres must agree with frozen ConfigureNBV.
    # This 1 mm hard ceiling can only be tightened.
    max_frozen_target_center_drift_m: 0.001
    max_plan_start_translation_drift_m: 0.001
    max_plan_start_rotation_drift_deg: 0.5
    # These are hard ceilings; command-line overrides may only make them stricter.
    max_plan_target_translation_drift_m: 0.0015
    max_plan_target_rotation_drift_deg: 0.5
    max_plan_solution_drift_rad: 0.010
    post_target_position_tolerance_m: 0.005
    post_target_rotation_tolerance_deg: 2.0

    # The current core's look-at convention can expose large, unnecessary
    # roll. Preserve the raw result for diagnosis, but only accept one small
    # slerp segment whose actual shortest SO(3) change is at most 10 degrees.
    max_selected_camera_rotation_deg: 10.0
    max_ik_joint_delta_rad: 0.08
    candidate_alphas: [1.0, 0.5, 0.25, 0.125, 0.0625, 0.03125]
